version: 1
env:
  variables:
    SENTRY_ORG: "cwagne17"
    SENTRY_PROJECT: "chriswagnerdev"
frontend:
  phases:
    preBuild:
      commands:
        - "npm ci --cache .npm --prefer-offline"
    build:
      commands:
        - "npm run build"
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - ".next/cache/**/*"
      - ".npm/**/*"
